name: Main Commit Checks
on: [push]

jobs:
    build:
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        runs-on: macos-latest

        strategy:
            matrix:
                # The node version, you can put one or many versions in here to test with
                node: [22.x]
        steps:
            - name: Checkout
              uses: actions/checkout@v1

            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v1
              with:
                  node-version: ${{ matrix.node }}

            - name: Create .npmrc
              run: echo '//registry.npmjs.org/:_authToken= ${{ secrets.NPM_TOKEN }}' >> .npmrc
            - run: npm ci --network-timeout 1000000
              env:
                  CYPRESS_CACHE_FOLDER: ~/.cache/Cypress

            - name: linting
              run: npm run lint

            - name: unit-tests
              run: npm test:unit

            - name: cypress-run
              uses: cypress-io/github-action@v2
              env:
                  USE_HTTP: true
              with:
                  start: npm run test:e2e:ci
                  wait-on: 'http://localhost:4173/'
                  # wait for 3 minutes for the server to respond
                  wait-on-timeout: 300
                  browser: chrome
                  headless: true

            # These extract all artifacts out from the container to git so they can be previewed
            - name: extract screenshots to git
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: cypress-screenshots
                  path: cypress/screenshots
            # Test run video was always captured, so this action uses "always()" condition
            - name: extract videos to git
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: cypress-videos
                  path: cypress/videos
